name: Ansible CI
true:
  push:
    branches:
    - main
    paths:
    - ansible/**
    - .github/workflows/ansible-ci.yml
  pull_request:
    branches:
    - main
    paths:
    - ansible/**
    - .github/workflows/ansible-ci.yml
  workflow_dispatch: null
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - name: Check out the codebase
      uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: 'python -m pip install --upgrade pip

        pip install ansible ansible-lint yamllint molecule molecule-docker

        '
    - name: Run ansible-lint
      run: 'cd ansible

        ansible-lint

        '
  molecule:
    name: Molecule
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        role:
        - code_integrity
    steps:
    - name: Check out the codebase
      uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: 'python -m pip install --upgrade pip

        pip install ansible molecule molecule-docker pytest pytest-testinfra docker

        '
    - name: Run Molecule tests
      run: 'cd ansible/roles/${{ matrix.role }}

        molecule test

        '
      env:
        PY_COLORS: '1'
        ANSIBLE_FORCE_COLOR: '1'
