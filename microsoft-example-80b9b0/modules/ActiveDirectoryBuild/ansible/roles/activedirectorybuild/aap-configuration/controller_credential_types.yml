---
controller_credential_types:
- name: Azure Automation Credentials
  description: Credential type for Azure Automation Credentials
  kind: cloud
  inputs:
    fields:
    - id: default_dc_cred
      type: string
      label: Default Domain Controller Credential
      secret: true
      help_text: Credential used for domain controller operations
    - id: domain_controller_join
      type: string
      label: Domain Controller Join Credential
      secret: true
      help_text: Credential used for joining servers to the domain controller
    - id: domain_join
      type: string
      label: Domain Join Credential
      secret: true
      help_text: Credential used for joining member servers to the domain
    - id: temp_password
      type: string
      label: Temporary Password
      secret: true
      help_text: Temporary password used during setup operations
    required:
    - default_dc_cred
    - domain_join
  injectors:
    extra_vars:
      default_dc_cred: !unsafe '{{ default_dc_cred }}'
      domain_controller_join: !unsafe '{{ domain_controller_join }}'
      domain_join: !unsafe '{{ domain_join }}'
      temp_password: !unsafe '{{ temp_password }}'
