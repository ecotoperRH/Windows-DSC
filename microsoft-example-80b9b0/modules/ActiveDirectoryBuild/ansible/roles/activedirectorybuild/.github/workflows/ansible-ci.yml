---
name: Ansible CI
true:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
jobs:
  lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: "python -m pip install --upgrade pip\npip install ansible-lint\n"
      - name: Run ansible-lint
        run: ansible-lint
  molecule:
    name: Molecule Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: "python -m pip install --upgrade pip\npip install molecule molecule-plugins[docker] ansible-core docker pytest pytest-testinfra\n"
      - name: Run Molecule tests
        run: "cd ansible/roles/activedirectorybuild\nmolecule test\n"
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
