---
- name: Create Service Account OUs
  ansible.windows.win_powershell:
    script: 'Import-Module ActiveDirectory

      $domainDN = (Get-ADDomain).DistinguishedName

      # Create Service Accounts OU if it doesn''t exist $serviceAccountsOUPath = "OU=Service Accounts,$domainDN" if (-not (Get-ADOrganizationalUnit -Filter "DistinguishedName
      -eq ''$serviceAccountsOUPath''" -ErrorAction SilentlyContinue)) { New-ADOrganizationalUnit -Name "Service Accounts" -Path $domainDN -ProtectedFromAccidentalDeletion
      $true Write-Output "Created Service Accounts OU"

      } else { Write-Output "Service Accounts OU already exists" }

      # Create sub-OUs for different service account types $serviceAccountTypes = @("Application", "Database", "System", "Managed")

      foreach ($type in $serviceAccountTypes) { $ouPath = "OU=$type,$serviceAccountsOUPath" if (-not (Get-ADOrganizationalUnit -Filter "DistinguishedName -eq ''$ouPath''"
      -ErrorAction SilentlyContinue)) { New-ADOrganizationalUnit -Name $type -Path $serviceAccountsOUPath -ProtectedFromAccidentalDeletion $true Write-Output "Created
      $type OU under Service Accounts" } else { Write-Output "$type OU under Service Accounts already exists" } } '
  register: service_account_ou_result
- name: Display Service Account OU creation result
  ansible.builtin.debug:
    var: service_account_ou_result.output
- name: Generate service account passwords
  ansible.builtin.set_fact:
    svc_app_password: "{{ lookup('ansible.builtin.password', '/dev/null chars=ascii_letters,digits,punctuation length=24') }}"
    svc_sql_password: "{{ lookup('ansible.builtin.password', '/dev/null chars=ascii_letters,digits,punctuation length=24') }}"
    svc_web_password: "{{ lookup('ansible.builtin.password', '/dev/null chars=ascii_letters,digits,punctuation length=24') }}"
    svc_backup_password: "{{ lookup('ansible.builtin.password', '/dev/null chars=ascii_letters,digits,punctuation length=24') }}"
  no_log: true
- name: Create Standard Service Accounts
  ansible.windows.win_powershell:
    script: "Import-Module ActiveDirectory\n\n$domainDN = (Get-ADDomain).DistinguishedName\n$domain = (Get-ADDomain).NetBIOSName\n\n# Define service accounts to
      create\n$serviceAccounts = @(\n  @{\n    Name = \"svc-app\"\n    Path = \"OU=Application,OU=Service Accounts,$domainDN\"\n    Description = \"Application Service
      Account\"\n    Password = \"{{ svc_app_password }}\"\n  },\n  @{\n    Name = \"svc-sql\"\n    Path = \"OU=Database,OU=Service Accounts,$domainDN\"\n    Description
      = \"SQL Server Service Account\"\n    Password = \"{{ svc_sql_password }}\"\n  },\n  @{\n    Name = \"svc-web\"\n    Path = \"OU=Application,OU=Service Accounts,$domainDN\"\
      \n    Description = \"Web Application Service Account\"\n    Password = \"{{ svc_web_password }}\"\n  },\n  @{\n    Name = \"svc-backup\"\n    Path = \"OU=System,OU=Service
      Accounts,$domainDN\"\n    Description = \"Backup System Service Account\"\n    Password = \"{{ svc_backup_password }}\"\n  }\n)\n\nforeach ($account in $serviceAccounts)
      {\n  # Check if account exists\n  $existingAccount = Get-ADUser -Filter \"SamAccountName -eq '$($account.Name)'\" -ErrorAction SilentlyContinue\n  \n  if
      (-not $existingAccount) {\n    # Create service account\n    $password = ConvertTo-SecureString -String $account.Password -AsPlainText -Force\n    \n    New-ADUser
      -Name $account.Name `\n      -SamAccountName $account.Name `\n      -UserPrincipalName \"$($account.Name)@$((Get-ADDomain).DNSRoot)\" `\n      -Path $account.Path
      `\n      -Description $account.Description `\n      -Enabled $true `\n      -CannotChangePassword $true `\n      -PasswordNeverExpires $true `\n      -AccountPassword
      $password\n    \n    Write-Output \"Created service account: $($account.Name)\"\n  } else {\n    Write-Output \"Service account $($account.Name) already exists\"\
      \n  }\n}\n"
  register: service_accounts_result
  no_log: true
- name: Display Service Accounts creation result
  ansible.builtin.debug:
    var: service_accounts_result.output
- name: Create Group Managed Service Accounts (gMSAs)
  ansible.windows.win_powershell:
    script: 'Import-Module ActiveDirectory

      $domainDN = (Get-ADDomain).DistinguishedName $domain = (Get-ADDomain).DNSRoot

      # Create security groups for gMSA principals $gmsaGroups = @( @{ Name = "gMSA-SQL-Principals" Path = "OU=Groups,OU=Tier 1,$domainDN" Description = "Security
      principals that can retrieve the password for SQL gMSA" }, @{ Name = "gMSA-Web-Principals" Path = "OU=Groups,OU=Tier 1,$domainDN" Description = "Security principals
      that can retrieve the password for Web gMSA" } )

      foreach ($group in $gmsaGroups) { # Check if group exists $existingGroup = Get-ADGroup -Filter "Name -eq ''$($group.Name)''" -ErrorAction SilentlyContinue

      if (-not $existingGroup) { # Create security group New-ADGroup -Name $group.Name ` -SamAccountName $group.Name ` -GroupCategory Security ` -GroupScope Global
      ` -DisplayName $group.Name `     -Path $group.Path ` -Description $group.Description

      Write-Output "Created security group: $($group.Name)" } else { Write-Output "Security group $($group.Name) already exists" } }

      # Define gMSAs to create $gmsaAccounts = @( @{ Name = "gmsa-sql" Path = "OU=Managed,OU=Service Accounts,$domainDN" Description = "SQL Server gMSA" DNSHostName
      = "gmsa-sql.$domain" PrincipalsAllowedToRetrieveManagedPassword = "gMSA-SQL-Principals"

      ServicePrincipalNames = @("MSSQLSvc/sql.$domain", "MSSQLSvc/sql.$domain:1433") }, @{ Name = "gmsa-web" Path = "OU=Managed,OU=Service Accounts,$domainDN" Description
      = "Web Application gMSA" DNSHostName = "gmsa-web.$domain" PrincipalsAllowedToRetrieveManagedPassword = "gMSA-Web-Principals" ServicePrincipalNames = @("HTTP/web.$domain",
      "HTTP/web") } )

      foreach ($account in $gmsaAccounts) { # Check if gMSA exists $existingAccount = Get-ADServiceAccount -Filter "Name -eq ''$($account.Name)''" -ErrorAction
      SilentlyContinue

      if (-not $existingAccount) {     try { # Create gMSA New-ADServiceAccount -Name $account.Name ` -SamAccountName $account.Name ` -Path $account.Path `         -DNSHostName
      $account.DNSHostName ` -PrincipalsAllowedToRetrieveManagedPassword $account.PrincipalsAllowedToRetrieveManagedPassword `       -ServicePrincipalNames $account.ServicePrincipalNames
      ` -Description $account.Description ` -Enabled $true

      Write-Output "Created gMSA: $($account.Name)" } catch { Write-Output "Error creating gMSA $($account.Name): $_" } } else { Write-Output "gMSA $($account.Name)
      already exists" } } '
  register: gmsa_result
- name: Display gMSA creation result
  ansible.builtin.debug:
    var: gmsa_result.output
- name: Add Computers to gMSA Groups
  ansible.windows.win_powershell:
    script: 'Import-Module ActiveDirectory

      # Define computer accounts to add to gMSA groups $computerAssignments = @( @{ ComputerName = "SQL01$"     Group = "gMSA-SQL-Principals" }, @{ ComputerName
      = "SQL02$" Group = "gMSA-SQL-Principals" }, @{ ComputerName = "WEB01$"

      Group = "gMSA-Web-Principals" }, @{ ComputerName = "WEB02$" Group = "gMSA-Web-Principals" } )

      foreach ($assignment in $computerAssignments) { # Check if computer exists $computer = Get-ADComputer -Filter "SamAccountName -eq ''$($assignment.ComputerName)''"
      -ErrorAction SilentlyContinue   if ($computer) { # Check if computer is already a member of the group $group = Get-ADGroup -Identity $assignment.Group $isMember
      = Get-ADGroupMember -Identity $group | Where-Object { $_.SamAccountName -eq $assignment.ComputerName }

      if (-not $isMember) { # Add computer to group  Add-ADGroupMember -Identity $assignment.Group -Members $computer Write-Output "Added $($assignment.ComputerName)
      to $($assignment.Group)" } else { Write-Output "$($assignment.ComputerName) is already a member of $($assignment.Group)" } } else { Write-Output "Computer $($assignment.ComputerName)
      not found" } } '
  register: computer_assignment_result
- name: Display computer assignment result
  ansible.builtin.debug:
    var: computer_assignment_result.output
