---
- name: Validate required credential variables are defined
  ansible.builtin.assert:
    that:
      - domain_join is defined
      - domain_join.username is defined
      - domain_join.password is defined
      - domain_controller_join is defined
      - domain_controller_join.password is defined
    fail_msg: One or more required credential variables are not defined. Ensure the AAP credential type is attached to the job template.
    quiet: true
