---
- name: Configure Windows firewall for Active Directory
  ansible.windows.win_firewall_rule:
    name: "{{ item.name }}"
    localport: "{{ item.ports }}"
    action: allow
    direction: in
    protocol: "{{ item.protocol }}"
    profiles: domain,private
    state: present
    enabled: true
  loop:
    - name: Active Directory Domain Services
      ports: 53,88,135,389,445,464,636,3268,3269,49152-65535
      protocol: tcp
    - name: Active Directory Domain Services UDP
      ports: 53,88,123,389,445,464
      protocol: udp
  register: firewall_config
  tags:
    - molecule-notest
- name: Configure NTP settings
  ansible.windows.win_shell: '$ErrorActionPreference = "Stop" try { # Configure Windows Time service w32tm /config /syncfromflags:DOMHIER /update Restart-Service
    w32time w32tm /resync /force "NTP configuration successful" } catch { Write-Host "Error configuring NTP: $_" exit 1 } '
  register: ntp_config
  changed_when: "'NTP configuration successful' in ntp_config.stdout"
  tags:
    - molecule-notest
- name: Configure DNS settings
  ansible.windows.win_dns_client:
    adapter_names: "*"
    ipv4_addresses:
      - 127.0.0.1
    log_path: "{{ ansible_env.TEMP }}\\dns_config.log"
  register: dns_config
  tags:
    - molecule-notest
- name: Display configuration results
  ansible.builtin.debug:
    msg: "Firewall rules configured: {{ firewall_config.changed }} NTP configured: {{ ntp_config.changed }} DNS configured: {{ dns_config.changed }}"
