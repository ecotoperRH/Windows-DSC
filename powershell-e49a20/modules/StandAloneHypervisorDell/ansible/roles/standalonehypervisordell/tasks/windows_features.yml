---
- name: Check OS edition supports Hyper-V
  ansible.windows.win_shell: (Get-WmiObject Win32_OperatingSystem).Caption
  register: standalonehypervisordell_os_caption
  changed_when: false
- name: Display OS edition
  ansible.builtin.debug:
    msg: "Target OS: {{ standalonehypervisordell_os_caption.stdout | trim }}"
- name: Install required Windows features
  ansible.windows.win_feature:
    name: "{{ standalonehypervisordell_windows_features }}"
    state: present
    include_sub_features: true
    include_management_tools: true
  register: standalonehypervisordell_features_result
- name: Reboot after Windows feature installation
  ansible.windows.win_reboot:
    reboot_timeout: "{{ standalonehypervisordell_reboot_timeout }}"
    post_reboot_delay: "{{ standalonehypervisordell_post_reboot_delay }}"
    msg: Rebooting after Windows feature installation (Hyper-V and related roles)
  when: standalonehypervisordell_features_result.reboot_required | default(false)
- name: Verify Windows features are installed
  ansible.windows.win_feature:
    name: "{{ standalonehypervisordell_windows_features }}"
    state: present
    include_sub_features: true
  check_mode: true
  register: standalonehypervisordell_features_verify
- name: Assert all Windows features are present
  ansible.builtin.assert:
    that:
      - not standalonehypervisordell_features_verify.changed
    fail_msg: One or more Windows features failed to install correctly
    success_msg: All required Windows features are installed
