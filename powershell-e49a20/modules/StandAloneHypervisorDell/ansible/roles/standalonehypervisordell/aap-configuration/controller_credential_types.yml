---
controller_credential_types:
- name: Azure Automation Domain Join
  description: Domain join credential retrieved from Azure Automation credential store
    via Get-AutomationPSCredential
  kind: cloud
  inputs:
    fields:
    - id: domain_join_username
      type: string
      label: Domain Join Username
      help_text: Username of the Active Directory account used to join hosts to the
        domain
    - id: domain_join_password
      type: string
      label: Domain Join Password
      secret: true
      help_text: Password for the domain join account (DOMAIN_JOIN credential from
        Azure Automation)
    required:
    - domain_join_username
    - domain_join_password
  injectors:
    extra_vars:
      domain_join_username: !unsafe '{{ domain_join_username }}'
      domain_join_password: !unsafe '{{ domain_join_password }}'
