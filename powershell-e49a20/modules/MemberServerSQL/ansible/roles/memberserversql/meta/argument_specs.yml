---
argument_specs:
  main:
    short_description: Provision a Windows member server as a SQL Server 2016 host
    description:
      - Joins a Windows machine to an Active Directory domain.
      - Applies OS baseline hardening including UAC, timezone, and PowerShell execution policy.
      - Creates and removes required administrative directories.
      - Installs the .NET Framework 4.5 Windows feature.
      - Installs a named SQL Server 2016 instance (SCVMMSQL) using a Group Managed Service Account.
      - Configures SQL Server to listen on a custom TCP port (50001).
      - Opens the SQL Server TCP port in the Windows Firewall (Domain profile).
    options:
      memberserversql_sql_installer_source_path:
        type: str
        required: false
        default: C:\Admin\SQL2016_x64_ENU
        description: Local path on the target node where the SQL Server 2016 installer media has been pre-staged. Must contain setup.exe.
      memberserversql_admin_path:
        type: str
        required: false
        default: C:\Admin
        description: Path to the admin directory that must exist on the target node.
      memberserversql_api_folder_path:
        type: str
        required: false
        default: C:\Admin\APIRegistration
        description: Path to the API registration directory that must be absent on the target node.
      memberserversql_domain_name:
        type: str
        required: false
        default: contoso.local
        description: FQDN of the Active Directory domain to join.
      memberserversql_sql_instance_name:
        type: str
        required: false
        default: SCVMMSQL
        description: Name of the SQL Server named instance to install.
      memberserversql_sql_tcp_port:
        type: int
        required: false
        default: 50001
        description: TCP port that the SQL Server named instance will listen on.
      memberserversql_sql_features:
        type: str
        required: false
        default: SQLENGINE
        description: SQL Server features to install (comma-separated). Defaults to SQLENGINE only.
      memberserversql_sql_collation:
        type: str
        required: false
        default: SQL_Latin1_General_CP1_CI_AS
        description: SQL Server collation setting for the instance.
      memberserversql_sql_admin_group:
        type: str
        required: false
        default: CONTOSO\Admin-SQL-Group
        description: Active Directory group to grant SQL Server sysadmin rights.
      memberserversql_sql_gmsa_account:
        type: str
        required: false
        default: CONTOSO\sql-gmsa$
        description: Group Managed Service Account (gMSA) used for the SQL Server Engine and SQL Server Agent services. No password is required for gMSA
          accounts.
      memberserversql_sql_install_shared_dir:
        type: str
        required: false
        default: C:\Program Files\Microsoft SQL Server
        description: Shared installation directory for 64-bit SQL Server components.
      memberserversql_sql_install_shared_wow_dir:
        type: str
        required: false
        default: C:\Program Files (x86)\Microsoft SQL Server
        description: Shared installation directory for 32-bit (WOW64) SQL Server components.
      memberserversql_sql_instance_dir:
        type: str
        required: false
        default: C:\Program Files\Microsoft SQL Server
        description: Installation directory for the SQL Server named instance.
      memberserversql_sql_data_dir:
        type: str
        required: false
        default: C:\Program Files\Microsoft SQL Server\MSSQL13.MSSQLSERVER\MSSQL\Data
        description: Directory for SQL Server data files, log files, TempDB, and TempDB log files.
      memberserversql_sql_backup_dir:
        type: str
        required: false
        default: C:\Program Files\Microsoft SQL Server\MSSQL13.MSSQLSERVER\MSSQL\Backup
        description: Directory for SQL Server backup files.
      memberserversql_timezone:
        type: str
        required: false
        default: Pacific Standard Time
        description: Windows timezone ID to set on the target node.
      memberserversql_ps_execution_policy:
        type: str
        required: false
        default: RemoteSigned
        description: PowerShell execution policy to set for the LocalMachine scope.
      memberserversql_windows_features:
        type: list
        elements: str
        required: false
        default:
          - Net-Framework-45-Core
        description: List of Windows features to install on the target node.
      memberserversql_firewall_rule_name:
        type: str
        required: false
        default: AllowSQLConnection
        description: Name of the Windows Firewall inbound rule for SQL Server.
      memberserversql_firewall_rule_display_name:
        type: str
        required: false
        default: Allow SQL Connection
        description: Display name of the Windows Firewall rule for SQL Server.
      memberserversql_firewall_rule_description:
        type: str
        required: false
        default: Firewall Rule to allow SQL communication
        description: Description of the Windows Firewall rule for SQL Server.
      memberserversql_firewall_rule_group:
        type: str
        required: false
        default: DSC Configuration Rules
        description: Group name for the Windows Firewall rule.
      memberserversql_firewall_rule_profile:
        type: str
        required: false
        default: Domain
        description: Network profile for the Windows Firewall rule (Domain, Private, Public).
      memberserversql_firewall_rule_direction:
        type: str
        required: false
        default: Inbound
        description: Direction of the Windows Firewall rule (Inbound or Outbound).
      memberserversql_firewall_rule_protocol:
        type: str
        required: false
        default: TCP
        description: Protocol for the Windows Firewall rule.
      domain_join_user:
        type: str
        required: true
        description: Username of the Active Directory account with rights to join machines to the domain. Injected at runtime by the AAP domain join credential
          type.
      domain_join_password:
        type: str
        required: true
        description: Password for the domain join account. Injected at runtime by the AAP domain join credential type.
