---
controller_credential_types:
- name: Azure Automation Domain Join
  description: Domain join credential sourced from Azure Automation Vault via Get-AutomationPSCredential
  kind: cloud
  inputs:
    fields:
    - id: domain_join_user
      type: string
      label: Domain Join Username
      help_text: Active Directory account with rights to join machines to the domain
        (e.g., CONTOSO\svc-domainjoin)
    - id: domain_join_password
      type: string
      label: Domain Join Password
      secret: true
      help_text: Password for the domain join service account
    required:
    - domain_join_user
    - domain_join_password
  injectors:
    extra_vars:
      domain_join_user: !unsafe '{{ domain_join_user }}'
      domain_join_password: !unsafe '{{ domain_join_password }}'
