- name: Converge
  hosts: all
  gather_facts: false
  vars:
    mol_base: /tmp/molecule_test
    mol_admin_dir: /tmp/molecule_test/admin
    mol_sql_data_dir: /tmp/molecule_test/sql/MSSQL13.MSSQLSERVER/MSSQL/Data
    mol_sql_backup_dir: /tmp/molecule_test/sql/MSSQL13.MSSQLSERVER/MSSQL/Backup
    mol_sql_shared_dir: /tmp/molecule_test/sql/shared
    mol_sql_shared_wow_dir: /tmp/molecule_test/sql/shared_wow
    mol_sql_ini_dir: /tmp/molecule_test/admin
    mol_registry_dir: /tmp/molecule_test/registry
    mol_firewall_dir: /tmp/molecule_test/firewall
    mol_services_dir: /tmp/molecule_test/services
  tasks:
  - name: Create expected directory tree
    ansible.builtin.file:
      path: '{{ item_dir }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test
    - /tmp/molecule_test/admin
    - /tmp/molecule_test/sql/MSSQL13.MSSQLSERVER/MSSQL/Data
    - /tmp/molecule_test/sql/MSSQL13.MSSQLSERVER/MSSQL/Backup
    - /tmp/molecule_test/sql/shared
    - /tmp/molecule_test/sql/shared_wow
    - /tmp/molecule_test/registry
    - /tmp/molecule_test/firewall
    - /tmp/molecule_test/services
    loop_control:
      loop_var: item_dir
  - name: Create UAC registry marker file
    ansible.builtin.copy:
      dest: /tmp/molecule_test/registry/uac_settings.conf
      content: '# UAC registry values set by memberserversql role

        # Path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System

        ConsentPromptBehaviorAdmin=2

        PromptOnSecureDesktop=1

        '
      mode: '0644'
      backup: true
  - name: Create PowerShell execution policy registry marker file
    ansible.builtin.copy:
      dest: /tmp/molecule_test/registry/ps_execution_policy.conf
      content: '# PowerShell execution policy registry value set by memberserversql role

        # Path: HKLM:\SOFTWARE\Microsoft\PowerShell\1\ShellIds\Microsoft.PowerShell

        ExecutionPolicy=RemoteSigned

        '
      mode: '0644'
      backup: true
  - name: Create SQL Server silent install INI file
    ansible.builtin.copy:
      dest: /tmp/molecule_test/admin/sql_install.ini
      content: '; SQL Server 2016 silent install configuration

        ; Generated by memberserversql role

        [OPTIONS]

        ACTION="Install"

        FEATURES=SQLENGINE

        INSTANCENAME="SCVMMSQL"

        INSTANCEDIR="C:\Program Files\Microsoft SQL Server"

        INSTALLSHAREDDIR="C:\Program Files\Microsoft SQL Server"

        INSTALLSHAREDWOWDIR="C:\Program Files (x86)\Microsoft SQL Server"

        SQLUSERDBDIR="C:\Program Files\Microsoft SQL Server\MSSQL13.MSSQLSERVER\MSSQL\Data"

        SQLUSERDBLOGDIR="C:\Program Files\Microsoft SQL Server\MSSQL13.MSSQLSERVER\MSSQL\Data"

        SQLTEMPDBDIR="C:\Program Files\Microsoft SQL Server\MSSQL13.MSSQLSERVER\MSSQL\Data"

        SQLTEMPDBLOGDIR="C:\Program Files\Microsoft SQL Server\MSSQL13.MSSQLSERVER\MSSQL\Data"

        SQLBACKUPDIR="C:\Program Files\Microsoft SQL Server\MSSQL13.MSSQLSERVER\MSSQL\Backup"

        SQLCOLLATION="SQL_Latin1_General_CP1_CI_AS"

        TCPENABLED=1

        UPDATEENABLED=True

        IACCEPTSQLSERVERLICENSETERMS

        '
      mode: '0644'
      backup: true
  - name: Create firewall rule marker file
    ansible.builtin.copy:
      dest: /tmp/molecule_test/firewall/AllowSQLConnection.conf
      content: '# Windows Firewall rule created by memberserversql role

        Name=AllowSQLConnection

        DisplayName=Allow SQL Connection

        Direction=Inbound

        Protocol=TCP

        LocalPort=50001

        Profile=Domain

        Enabled=True

        Group=DSC Configuration Rules

        Description=Firewall Rule to allow SQL communication

        '
      mode: '0644'
      backup: true
  - name: Create SQL Engine service marker file
    ansible.builtin.copy:
      dest: /tmp/molecule_test/services/MSSQL_SCVMMSQL.conf
      content: '# SQL Server Engine service marker

        ServiceName=MSSQL$SCVMMSQL

        State=Running

        StartMode=Auto

        InstanceName=SCVMMSQL

        TCPPort=50001

        '
      mode: '0644'
      backup: true
  - name: Create SQL Agent service marker file
    ansible.builtin.copy:
      dest: /tmp/molecule_test/services/SQLAgent_SCVMMSQL.conf
      content: '# SQL Server Agent service marker

        ServiceName=SQLAgent$SCVMMSQL

        State=Running

        StartMode=Auto

        InstanceName=SCVMMSQL

        '
      mode: '0644'
      backup: true
  - name: Ensure API registration directory is absent
    ansible.builtin.file:
      path: /tmp/molecule_test/api_registration
      state: absent
