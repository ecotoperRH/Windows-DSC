;
; SQL Server 2016 Silent Install Configuration File
; Generated for Ansible role: memberserversql
;
; USAGE:
;   setup.exe /ConfigurationFile=sql_install.ini
;             /SQLSVCACCOUNT=<gMSA_account>
;             /AGTSVCACCOUNT=<gMSA_account>
;             /SQLSYSADMINACCOUNTS=<admin_group>
;             /IAcceptSQLServerLicenseTerms
;
; NOTE: Sensitive parameters (service accounts, sysadmin accounts, license acceptance)
;       are passed on the command line by the Ansible task to avoid storing them here.
;

[OPTIONS]

; Specifies a Setup work flow, like INSTALL, UNINSTALL, or UPGRADE.
ACTION="Install"

; Specifies features to install, uninstall, or upgrade.
FEATURES=SQLENGINE

; Specifies the named instance name.
INSTANCENAME="SCVMMSQL"

; Specifies the Instance ID for the SQL Server instance.
INSTANCEID="SCVMMSQL"

; Specifies that SQL Server Setup should not display the privacy statement.
SUPPRESSPRIVACYSTATEMENTNOTICE="True"

; Specifies that SQL Server Setup should not display the End User License Agreement.
; /IAcceptSQLServerLicenseTerms must be passed on the command line.
IACCEPTSQLSERVERLICENSETERMS="True"

; Specifies the installation mode.
QUIET="True"
QUIETSIMPLE="False"
INDICATEPROGRESS="False"

; Specifies the SQL Server collation.
SQLCOLLATION="SQL_Latin1_General_CP1_CI_AS"

; Specifies the shared installation directory for 64-bit components.
INSTALLSHAREDDIR="C:\Program Files\Microsoft SQL Server"

; Specifies the shared installation directory for 32-bit (WOW64) components.
INSTALLSHAREDWOWDIR="C:\Program Files (x86)\Microsoft SQL Server"

; Specifies the installation directory for the instance.
INSTANCEDIR="C:\Program Files\Microsoft SQL Server"

; Specifies the data directory for SQL Server databases.
INSTALLSQLDATADIR="C:\Program Files\Microsoft SQL Server\MSSQL13.MSSQLSERVER\MSSQL\Data"

; Specifies the directory for user database data files.
SQLUSERDBDIR="C:\Program Files\Microsoft SQL Server\MSSQL13.MSSQLSERVER\MSSQL\Data"

; Specifies the directory for user database log files.
SQLUSERDBLOGDIR="C:\Program Files\Microsoft SQL Server\MSSQL13.MSSQLSERVER\MSSQL\Data"

; Specifies the directory for TempDB data files.
SQLTEMPDBDIR="C:\Program Files\Microsoft SQL Server\MSSQL13.MSSQLSERVER\MSSQL\Data"

; Specifies the directory for TempDB log files.
SQLTEMPDBLOGDIR="C:\Program Files\Microsoft SQL Server\MSSQL13.MSSQLSERVER\MSSQL\Data"

; Specifies the backup directory.
SQLBACKUPDIR="C:\Program Files\Microsoft SQL Server\MSSQL13.MSSQLSERVER\MSSQL\Backup"

; Specifies whether SQL Server Setup should update the product.
UPDATEENABLED="True"

; Specifies the source for product updates.
; UPDATESOURCE="MU"

; Specifies the SQL Server Browser service startup type.
BROWSERSVCSTARTUPTYPE="Disabled"

; Specifies the SQL Server Agent service startup type.
AGTSVCSTARTUPTYPE="Automatic"

; Specifies the SQL Server Engine service startup type.
SQLSVCSTARTUPTYPE="Automatic"

; Specifies the TCP/IP port that SQL Server will listen on.
; Note: TCP port is configured post-install via PowerShell SMO in task 06_sql_network.yml
TCPENABLED=1

; Specifies whether Named Pipes are enabled.
NPENABLED=0

; Specifies the Windows account(s) to provision as SQL Server system administrators.
; Passed on the command line: /SQLSYSADMINACCOUNTS
; SQLSYSADMINACCOUNTS=

; Specifies the service account for the SQL Server Engine service.
; Passed on the command line: /SQLSVCACCOUNT (gMSA — no password required)
; SQLSVCACCOUNT=

; Specifies the service account for the SQL Server Agent service.
; Passed on the command line: /AGTSVCACCOUNT (gMSA — no password required)
; AGTSVCACCOUNT=
