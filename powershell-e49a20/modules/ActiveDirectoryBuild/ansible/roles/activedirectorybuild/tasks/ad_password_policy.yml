---
- name: Read current domain default password and lockout policy
  ansible.windows.win_shell: "$p = Get-ADDefaultDomainPasswordPolicy -Identity \"{{ activedirectorybuild_domain_name }}\"\n[PSCustomObject]@{\n  HistoryCount    \
    \   = $p.PasswordHistoryCount\n  MinAge             = [int]$p.MinPasswordAge.TotalMinutes\n  MaxAge             = [int]$p.MaxPasswordAge.TotalMinutes\n  MinLength\
    \          = $p.MinPasswordLength\n  Complexity         = $p.ComplexityEnabled.ToString()\n  Reversible         = $p.ReversibleEncryptionEnabled.ToString()\n\
    \  LockoutDuration    = [int]$p.LockoutDuration.TotalMinutes\n  LockoutObsWindow   = [int]$p.LockoutObservationWindow.TotalMinutes\n  LockoutThreshold   = $p.LockoutThreshold\n\
    } | ConvertTo-Json -Compress\n"
  register: activedirectorybuild_current_policy
  changed_when: false
- name: Configure domain default password and lockout policy
  ansible.windows.win_shell: 'Set-ADDefaultDomainPasswordPolicy ` -Identity "{{ activedirectorybuild_domain_name }}" ` -PasswordHistoryCount {{ activedirectorybuild_password_history_count
    }} ` -MinPasswordAge (New-TimeSpan -Minutes {{ activedirectorybuild_min_password_age }}) ` -MaxPasswordAge (New-TimeSpan -Minutes {{ activedirectorybuild_max_password_age
    }}) ` -MinPasswordLength {{ activedirectorybuild_min_password_length }} ` -ComplexityEnabled ${{ activedirectorybuild_complexity_enabled | bool | string | capitalize
    }} ` -ReversibleEncryptionEnabled ${{ activedirectorybuild_reversible_encryption_enabled | bool | string | capitalize }} ` -LockoutDuration (New-TimeSpan -Minutes
    {{ activedirectorybuild_lockout_duration }}) ` -LockoutObservationWindow (New-TimeSpan -Minutes {{ activedirectorybuild_lockout_observation_window }}) ` -LockoutThreshold
    {{ activedirectorybuild_lockout_threshold }} '
  changed_when: true
  vars:
    _current: "{{ activedirectorybuild_current_policy.stdout | from_json }}"
  when: "(_current.HistoryCount | int) != (activedirectorybuild_password_history_count | int) or (_current.MinAge | int) != (activedirectorybuild_min_password_age
    | int) or (_current.MaxAge | int) != (activedirectorybuild_max_password_age | int) or (_current.MinLength | int) != (activedirectorybuild_min_password_length
    | int) or (_current.Complexity | lower) != (activedirectorybuild_complexity_enabled | bool | string | lower) or (_current.Reversible | lower) != (activedirectorybuild_reversible_encryption_enabled
    | bool | string | lower) or (_current.LockoutDuration | int) != (activedirectorybuild_lockout_duration | int) or (_current.LockoutObsWindow | int) != (activedirectorybuild_lockout_observation_window
    | int) or (_current.LockoutThreshold | int) != (activedirectorybuild_lockout_threshold | int)\n"
