---
- name: Validate required credential variables are defined
  ansible.builtin.assert:
    that:
      - activedirectorybuild_default_dc_password is defined
      - activedirectorybuild_default_dc_password | length > 0
      - activedirectorybuild_dc_join_password is defined
      - activedirectorybuild_dc_join_password | length > 0
      - activedirectorybuild_domain_join_password is defined
      - activedirectorybuild_domain_join_password | length > 0
      - activedirectorybuild_temp_password is defined
      - activedirectorybuild_temp_password | length > 0
    fail_msg: One or more required credential variables are not defined. Ensure the AAP credential type is attached to the job template.
    quiet: true
