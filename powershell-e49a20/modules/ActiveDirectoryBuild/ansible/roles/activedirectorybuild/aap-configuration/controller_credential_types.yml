---
controller_credential_types:
- name: Azure Automation Default DC Credential
  description: Forest safe-mode administrator password and DC admin credential used
    during AD forest creation
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Administrator username for the Domain Controller and Safe Mode recovery
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Password used for both the DC administrator account and the Active
        Directory Safe Mode Administrator (DSRM) password during forest creation
    required:
    - username
    - password
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
- name: Azure Automation Domain Controller Join Credential
  description: Domain admin credential used to promote additional Domain Controllers
    and join them to the existing forest
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Domain administrator username with rights to promote a Domain Controller
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Password for the domain administrator account; also used as the SafemodeAdministratorPassword
        for hub DC promotion
    required:
    - username
    - password
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
- name: Azure Automation Domain Join Credential
  description: Service account credential used to join Windows machines to the Active
    Directory domain
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Domain join service account username with delegation rights to join
        computers to the domain
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Password for the domain join service account
    required:
    - username
    - password
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
- name: Azure Automation Temporary Password Credential
  description: Placeholder credential providing a temporary initial password for newly
    provisioned AD user accounts
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Username component of the temporary credential object (may be a placeholder
        value)
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Temporary initial password assigned to new AD admin user accounts
        (AdminOne, AdminTwo, AdminThree, AD-Domain-Join, DC-Domain-Join) at creation
        time
    required:
    - password
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
