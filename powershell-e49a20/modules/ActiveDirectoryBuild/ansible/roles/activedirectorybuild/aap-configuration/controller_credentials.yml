---
controller_credentials:
- name: Azure Automation Default DC Credential - activedirectorybuild
  description: Forest safe-mode administrator password and DC admin credential used
    during AD forest creation
  organization: Default
  credential_type: Azure Automation Default DC Credential
  update_secrets: true
  inputs:
    username: '{{ username }}'
    password: '{{ vault_password }}'
- name: Azure Automation Domain Controller Join Credential - activedirectorybuild
  description: Domain admin credential used to promote additional Domain Controllers
    and join them to the existing forest
  organization: Default
  credential_type: Azure Automation Domain Controller Join Credential
  update_secrets: true
  inputs:
    username: '{{ username }}'
    password: '{{ vault_password }}'
- name: Azure Automation Domain Join Credential - activedirectorybuild
  description: Service account credential used to join Windows machines to the Active
    Directory domain
  organization: Default
  credential_type: Azure Automation Domain Join Credential
  update_secrets: true
  inputs:
    username: '{{ username }}'
    password: '{{ vault_password }}'
- name: Azure Automation Temporary Password Credential - activedirectorybuild
  description: Placeholder credential providing a temporary initial password for newly
    provisioned AD user accounts
  organization: Default
  credential_type: Azure Automation Temporary Password Credential
  update_secrets: true
  inputs:
    username: '{{ username }}'
    password: '{{ vault_password }}'
